# Netlify configuration for All Structure Maintenance

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Function configuration
[functions]
  node_bundler = "esbuild"

# Old-host and /services/roofing redirects, run before the Prerender extension.
# The host check needs every page path, so this matches /* and skips static
# files (those are still redirected by the forced rule in _redirects).
[[edge_functions]]
  path = "/*"
  excludedPath = ["/assets/*", "/images/*"]
  function = "legacy-redirects"

# Deploy previews and branch deploys only. Production does not get this header.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"
